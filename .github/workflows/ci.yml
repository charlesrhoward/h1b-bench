name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  data-api-grants:
    name: Data API permission contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Prove fresh-schema access and restrictions
        run: node scripts/test-data-api-grants.mjs --snapshot-dir "$RUNNER_TEMP/data-api-grants"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: data-api-permission-snapshots
          path: ${{ runner.temp }}/data-api-grants/
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      # Rules: web/eslint.shared-rules.mjs. Every rule is an error; inline disables and ts-ignore fail.
      - run: pnpm lint
      - run: pnpm check:location
      - name: Verify explicit Data API access decisions
        run: pnpm security:migration-grants && pnpm test:migration-grants

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm typecheck

  etl:
    name: etl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    env:
      RUFF_VERSION: 0.16.10
    steps:
      - uses: actions/checkout@v4
      # Same script as local `pnpm preflight`: ruff, no suppressions, 500-line cap.
      - run: scripts/check-etl.sh

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-

      # Public publishable key — same one shipped to every browser; safe to inline.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://skiuhovfpiaofmctajhr.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Zzz1XAfsHrVgUyzGscuDSA_JYGYiwdG

  # Required status check on main. Keep this job name stable: it gates merges
  # and fails unless every job above succeeded.
  preflight:
    name: preflight
    if: always()
    needs: [lint, typecheck, etl, build, data-api-grants]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require all application and database checks to succeed
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} etl=${{ needs.etl.result }} build=${{ needs.build.result }} data-api-grants=${{ needs['data-api-grants'].result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.etl.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs['data-api-grants'].result }}" = success
