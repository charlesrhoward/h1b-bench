name: preflight

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      # Rules: web/eslint.shared-rules.mjs. Every rule is an error; inline disables and ts-ignore fail.
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm typecheck

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    env:
      RUFF_VERSION: 0.16.10
    steps:
      - uses: actions/checkout@v4
      # Rules: ruff.toml. --ignore-noqa makes `# noqa` comments inert.
      - run: pipx run "ruff==$RUFF_VERSION" check --ignore-noqa --output-format github
      # Ruff has no file-length rule and cannot reject noqa comments, so check both here.
      - name: No suppressions, 500-line cap
        run: |
          failed=0
          if grep -rnE '#\s*(noqa|ruff:\s*noqa|type:\s*ignore|pyright:\s*ignore)' --include='*.py' etl; then
            echo "::error::Suppression comments are not allowed. Fix the code."
            failed=1
          fi
          for f in $(git ls-files 'etl/*.py'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "::error file=$f::$lines lines (max 500)"
              failed=1
            fi
          done
          exit $failed

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-

      # Public publishable key — same one shipped to every browser; safe to inline.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://skiuhovfpiaofmctajhr.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Zzz1XAfsHrVgUyzGscuDSA_JYGYiwdG

  # Required status check on main. Keep this job name stable: it gates merges
  # and fails unless every job above succeeded.
  preflight:
    name: preflight
    if: always()
    needs: [lint, typecheck, ruff, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require lint, typecheck, ruff, and build to succeed
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} ruff=${{ needs.ruff.result }} build=${{ needs.build.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.ruff.result }}" = success
          test "${{ needs.build.result }}" = success
